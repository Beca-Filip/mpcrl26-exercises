[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mpcrl26-exercises"
version = "0.1.0"
description = "Python environment for the 2026 MPC and RL school exercises"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "casadi>=3.6,<4",
    "gymnasium[classic-control,toy-text]>=1.0,<2",
    "matplotlib>=3.8,<4",
    "marimo>=0.25,<1",
    "numpy>=1.26,<2",
    "pillow>=10,<13",
    "scipy>=1.12,<2",
    "torch>=2.4,<3",
]

[project.urls]
Homepage = "https://www.syscop.de/teaching/ws2026/fall-school-model-predictive-control-and-reinforcement-learning"
Repository = "https://github.com/mpcrl-school/mpcrl26-exercises"

[tool.setuptools]
packages = []

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ty.rules]
all = "ignore"
